location ~ /whiteboard {
    ssi on;

    proxy_pass {{ .Env.WHITEBOARD_URL_BASE }};
}

# for webpack-dev-server
location = /whiteboard_ws {
    proxy_pass {{ .Env.WHITEBOARD_URL_BASE }};
    proxy_redirect   off;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host {{ .Env.XMPP_DOMAIN }};
}

# docjali (= whiteboard websocket backend server)
location ~ ^{{ .Env.DOCJALI_API_BASE }} {
    rewrite ^/docjali/(.*)$ /$1 break;
    proxy_pass          http://docjali:{{ .Env.DOCJALI_API_PORT }};
    proxy_set_header    X-Forwarded-For $remote_addr;
    proxy_set_header    Upgrade $http_upgrade;
    proxy_set_header    Connection "upgrade";
    proxy_cache_bypass  $http_upgrade;
    proxy_set_header    Host {{ .Env.XMPP_DOMAIN }};
    proxy_redirect      off;
}

{{ if .Env.DOCJALI_FILES_BASE }}
# docjali converted files
location ~ ^{{ .Env.DOCJALI_FILES_BASE }}/(.+)$ {
    add_header 'Access-Control-Allow-Origin' '*';
    alias  /files/$1;
}
{{ end }}
