server_name _;

client_max_body_size 0;
large_client_header_buffers 4 32k;

location / {
    proxy_pass http://web:8088;

    # ssi on with javascript for multidomain variables in config.js
    ssi on;
    ssi_types application/x-javascript application/javascript;

    index index.html index.htm;
    error_page 404 /static/404.html;
    set $prefix "";

    proxy_http_version 1.1;
    proxy_buffering on;
    proxy_set_header Accept-Encoding "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
}

location ~ \.env {
    deny all;
}

location = /config.js {
    if (-f /web/config.${subdomain}js) {
        set $target /web/config.${subdomain}js;
        break;
    }

    set $target /web/config.js;
    alias $target;

    ssi on;
    ssi_types application/javascript text/javascript;
}

location = /interface_config.js {
    if (-f /web/interface_config.${subdomain}js) {
        set $target /web/interface_config.${subdomain}js;
        break;
    }

    set $target /web/interface_config.js;
    alias $target;

    ssi on;
    ssi_types application/javascript text/javascript;
}

location = /external_api.js {
    add_header 'Access-Control-Allow-Origin' '*';
    proxy_pass http://web:8088/libs/external_api.min.js;
}

location = /title.html {
    alias /web/title.html;
}

location = /static/404.html {
    ssi on;
    ssi_types text/html;

    proxy_pass http://web:8088/static/404.html;
}

location ~ ^/custom-(static|images|fonts|lang|sounds)/(.*)$
{
    add_header 'Access-Control-Allow-Origin' '*';
    alias /web/custom-$1/$2;
}

location ~ ^/(lang)/(countries-.*)$
{
    add_header 'Access-Control-Allow-Origin' '*';
    proxy_pass http://web:8088/$1/countries/$2;
}

#ensure all static content can always be found first
location ~ ^/(libs|css|static|images|fonts|lang|sounds|connection_optimization|.well-known)/(.*)$
{
    ssi on;
    ssi_types application/x-javascript application/javascript;

    add_header 'Access-Control-Allow-Origin' '*';
    proxy_pass http://web:8088;
}

# BOSH
location = /http-bind {
    proxy_pass http://xmpp.vmeet-dev.tigersw.com:5280/http-bind;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host vmeet-dev.tigersw.com;
    add_header 'Access-Control-Allow-Origin' '*';
}


# xmpp websockets
location = /xmpp-websocket {
    proxy_pass http://xmpp.vmeet-dev.tigersw.com:5280/xmpp-websocket?prefix=$prefix&$args;
    proxy_http_version 1.1;

    proxy_set_header Connection "upgrade";
    proxy_set_header Upgrade $http_upgrade;

    proxy_set_header Host vmeet-dev.tigersw.com;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 60s;
    tcp_nodelay on;
    add_header 'Access-Control-Allow-Origin' '*';
}


# help-desk
location ~ /help-desk {
    proxy_set_header Accept-Encoding "";
    proxy_pass       http://help-desk:3000;
    proxy_redirect   off;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host vmeet-dev.tigersw.com;
}


# colibri (JVB) websockets for jvb
location ~ ^/colibri-ws/([^/]*)/(.*) {
    proxy_pass http://$1:9090/colibri-ws/$1/$2$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host vmeet-dev.tigersw.com;
    tcp_nodelay on;
}


# colibri (JVB) Relay to Relay websockets
location ~ ^/colibri-relay-ws/([a-zA-Z0-9-\._]+)/(.*) {
    tcp_nodelay on;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_pass http://$1:9090/colibri-relay-ws/$1/$2$is_args$args;
}




    include /config/nginx/whiteboard.conf;



# auth page
location ~ /auth/page {
    ssi on;

    proxy_set_header Accept-Encoding "";
    proxy_pass       http://vmfront:3000;
    proxy_redirect   off;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host vmeet-dev.tigersw.com;
}

# for vmfront
location = /sockjs-node {
    proxy_pass http://vmfront:3000;
    proxy_redirect   off;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host vmeet-dev.tigersw.com;
}



# auth api
location ~ ^/auth/api {
    rewrite ^/auth/api/(.*)$ /$1 break;
    proxy_pass       http://vmapi:5000;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_cache_bypass $http_upgrade;
    proxy_set_header Host vmeet-dev.tigersw.com;
    proxy_redirect off;
}



# monitoring api
location ~ ^/admin/stats {
    proxy_pass http://grafana:3000;
}



# download files
location ~ ^/download/recordings/(.+)$ {
    alias  /recordings/$1;
    # force download
    add_header Content-disposition "attachment";
}



# download files
location ~ ^/download/files/(.+)$ {
    alias  /uploads/$1;
    # force download
    add_header Content-disposition "attachment";
}


location ~ ^/([^/?&:'"]+)/config.js$ {
    set $subdomain "$1.";
    set $subdir "$1/";

    alias /web/config.js;

    ssi on;
    ssi_types application/javascript text/javascript;
}

# Anything that didn't match above, and isn't a real file, assume it's a room name and redirect to /
location ~ ^/([^/?&:'"]+)/(.*)$ {
    set $subdomain "$1.";
    set $subdir "$1/";
    rewrite ^/([^/?&:'"]+)/(.*)$ /$2;
}

# BOSH for subdomains
location ~ ^/([^/?&:'"]+)/http-bind {
    set $subdomain "$1.";
    set $subdir "$1/";
    set $prefix "$1";

    rewrite ^/(.*)$ /http-bind;
}

# websockets for subdomains
location ~ ^/([^/?&:'"]+)/xmpp-websocket {
    set $subdomain "$1.";
    set $subdir "$1/";
    set $prefix "$1";

    rewrite ^/(.*)$ /xmpp-websocket;
}
